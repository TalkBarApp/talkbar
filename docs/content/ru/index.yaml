title: 'Документация TalkBar'
description: 'Документация TalkBar — приватного ИИ-помощника для заметок на Windows: встречи без бота, локальная расшифровка и поиск по всем разговорам.'
navigation: false
hero:
  title: 'Документация TalkBar'
  titleAccent: 'Документация'
  description: 'Установите TalkBar, запишите первую сессию и найдите нужную настройку.'
  search: 'Поиск по документации'
  cta:
    label: 'Начать'
    to: '/getting-started/introduction'

stages:
  - title: 'До'
    description: 'Установите TalkBar, выберите ИИ и спланируйте встречу.'
    links:
      - { label: 'Установка и обновление', to: '/getting-started/install-and-update' }
      - { label: 'Первая настройка', to: '/getting-started/first-run-setup' }
      - { label: 'Как TalkBar использует ИИ', to: '/ai/how-talkbar-uses-ai' }
      - { label: 'Планирование и подготовка', to: '/sessions/scheduling-and-preparing' }
  - title: 'Во время'
    description: 'Записывайте разговор, переводите его на лету и диктуйте заметки.'
    links:
      - { label: 'Начало сессии', to: '/sessions/starting-a-session' }
      - { label: 'Запись сессии', to: '/sessions/recording' }
      - { label: 'Перевод в реальном времени', to: '/voice/live-translation' }
      - { label: 'Диктовка', to: '/voice/dictation' }
  - title: 'После'
    description: 'Просмотрите сессию, сохраните важное и поделитесь результатом.'
    links:
      - { label: 'Подробности сессии', to: '/sessions/session-details' }
      - { label: 'Карточки знаний', to: '/knowledge/knowledge-cards' }
      - { label: 'Вопросы к TalkBar', to: '/chats-and-notes/ask-talkbar' }
      - { label: 'Экспорт', to: '/sharing/exports' }

reference:
  title: 'Справка'
  items:
    - title: 'Справочник настроек'
      description: 'Каждая настройка, что она делает и её значение по умолчанию'
      icon: 'i-heroicons-cog-6-tooth'
      to: '/settings/overview'
    - title: 'MCP и CLI'
      description: 'Подключите ИИ-ассистента или запускайте TalkBar из скриптов'
      icon: 'i-heroicons-command-line'
      to: '/mcp'
    - title: 'Устранение неполадок'
      description: 'Решение частых проблем с записью, ИИ и обновлениями'
      icon: 'i-heroicons-wrench-screwdriver'
      to: '/help/troubleshooting'
    - title: 'Частые вопросы'
      description: 'Короткие ответы на частые вопросы'
      icon: 'i-heroicons-question-mark-circle'
      to: '/help/faq'
