title: 'TalkBar Documentation'
description: 'Docs for TalkBar, the private AI note taker for Windows: capture meetings without a bot, transcribe locally and search every conversation.'
navigation: false
hero:
  title: 'TalkBar Documentation'
  titleAccent: 'Documentation'
  description: 'Set up TalkBar, record your first session, and find any setting.'
  search: 'Search the documentation'
  cta:
    label: 'Get started'
    to: '/getting-started/introduction'

stages:
  - title: 'Before'
    description: 'Install TalkBar, choose your AI and plan the meeting.'
    links:
      - { label: 'Install and update', to: '/getting-started/install-and-update' }
      - { label: 'First-run setup', to: '/getting-started/first-run-setup' }
      - { label: 'How TalkBar uses AI', to: '/ai/how-talkbar-uses-ai' }
      - { label: 'Scheduling and preparing', to: '/sessions/scheduling-and-preparing' }
  - title: 'During'
    description: 'Record the conversation, translate it live and dictate notes.'
    links:
      - { label: 'Starting a session', to: '/sessions/starting-a-session' }
      - { label: 'Recording a session', to: '/sessions/recording' }
      - { label: 'Live translation', to: '/voice/live-translation' }
      - { label: 'Dictation', to: '/voice/dictation' }
  - title: 'After'
    description: 'Review the session, keep what matters and share it.'
    links:
      - { label: 'Session details', to: '/sessions/session-details' }
      - { label: 'Knowledge cards', to: '/knowledge/knowledge-cards' }
      - { label: 'Ask TalkBar', to: '/chats-and-notes/ask-talkbar' }
      - { label: 'Exports', to: '/sharing/exports' }

reference:
  title: 'Look something up'
  items:
    - title: 'Settings reference'
      description: 'Every setting, what it does and its default'
      icon: 'i-heroicons-cog-6-tooth'
      to: '/settings/overview'
    - title: 'MCP & CLI'
      description: 'Connect an AI assistant or run TalkBar from a script'
      icon: 'i-heroicons-command-line'
      to: '/mcp'
    - title: 'Troubleshooting'
      description: 'Fix common problems with recording, AI and updates'
      icon: 'i-heroicons-wrench-screwdriver'
      to: '/help/troubleshooting'
    - title: 'FAQ'
      description: 'Quick answers to common questions'
      icon: 'i-heroicons-question-mark-circle'
      to: '/help/faq'
