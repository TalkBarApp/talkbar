<svg xmlns="http://www.w3.org/2000/svg" viewBox="26 375.3 480 100">
  <style>
    .tb-bar {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: tb-wave 60s ease-in-out infinite;
    }
    .tb-b2 { animation-delay: 0.12s; }
    .tb-b3 { animation-delay: 0.24s; animation-name: tb-wave-tall; }
    .tb-b4 { animation-delay: 0.36s; }
    .tb-b5 { animation-delay: 0.48s; }
    /* five wave runs per 60s loop -> irregular pauses of ~6.2s, 6.2s, 17.6s, 7.4s, 14.6s */
    @keyframes tb-wave {
      0%, 2%, 13%, 15%, 26%, 28%, 58%, 60%, 73%, 75%, 100% { transform: translateY(0) scaleY(1); opacity: 1; }
      0.5%, 13.5%, 26.5%, 58.5%, 73.5% { transform: translateY(2.5px) scaleY(0.58); opacity: 0.5; }
      1%, 14%, 27%, 59%, 74% { transform: translateY(-2.5px) scaleY(1.15); opacity: 1; }
      1.5%, 14.5%, 27.5%, 59.5%, 74.5% { transform: translateY(1.2px) scaleY(0.82); opacity: 0.7; }
    }
    @keyframes tb-wave-tall {
      0%, 2%, 13%, 15%, 26%, 28%, 58%, 60%, 73%, 75%, 100% { transform: translateY(0) scaleY(1); opacity: 1; }
      0.5%, 13.5%, 26.5%, 58.5%, 73.5% { transform: translateY(1.8px) scaleY(0.72); opacity: 0.5; }
      1%, 14%, 27%, 59%, 74% { transform: translateY(-1.8px) scaleY(1.06); opacity: 1; }
      1.5%, 14.5%, 27.5%, 59.5%, 74.5% { transform: translateY(0.9px) scaleY(0.9); opacity: 0.7; }
    }
    @media (prefers-reduced-motion: reduce) {
      .tb-bar { animation: none; }
    }
  </style>
